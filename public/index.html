<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debrid Canal</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>debrid-canal</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">
          <svg
            class="theme-toggle__sun"
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19" />
          </svg>
          <svg
            class="theme-toggle__moon"
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
          </svg>
        </button>
        <p>Drop a torrent file or magnet link to get an unrestricted download.</p>
      </header>

      <!-- Rate Limit Banner -->
      <div id="rate-limit-banner" class="rate-limit-banner" style="display: none;">
        <span class="rate-limit-banner__icon">⚠️</span>
        <span class="rate-limit-banner__message">
          Rate limit reached. Resuming in <strong id="rate-limit-countdown">60</strong> seconds...
        </span>
      </div>

      <section class="uploader">
        <div id="drop-zone" class="drop-zone" tabindex="0">
          <input id="file-input" type="file" accept=".torrent" hidden />
          <div class="drop-zone__content">
            <span class="drop-zone__icon">⬆️</span>
            <p><strong>Click to choose</strong> or drag a .torrent file here</p>
            <p class="muted">You can also drag a magnet link into this box.</p>
          </div>
        </div>

        <div class="magnet-input">
          <label for="magnet-text">Paste magnet link</label>
          <div class="magnet-input__row">
            <input
              id="magnet-text"
              type="text"
              placeholder="magnet:?xt=urn:btih:..."
            />
            <button id="magnet-submit" type="button">Submit</button>
          </div>
        </div>

        <div id="status" class="status"></div>
      </section>

      <section class="results">
        <h2>Your session torrents</h2>
        <div id="torrent-list" class="torrent-list"></div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
