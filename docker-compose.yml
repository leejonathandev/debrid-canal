services:
  debrid-canal:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-owner}/debrid-canal:latest
    build: .
    ports:
      - "3000:3000"
    environment:
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY}
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTH_USER_HEADER=${AUTH_USER_HEADER:-}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
